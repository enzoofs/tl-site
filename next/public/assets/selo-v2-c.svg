<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Selo TimeLabs — Astrolábio Canônico">
  <defs>
    <path id="orbit-c-top" d="M 60,300 A 240,240 0 0,1 540,300" fill="none"/>
  </defs>

  <g transform="translate(300,300)">
    <!-- Banda externa -->
    <circle r="250" fill="none" stroke="#2B2520" stroke-width="1.4"/>
    <circle r="232" fill="none" stroke="#2B2520" stroke-width="0.5"/>

    <!-- Anel interno -->
    <circle r="195" fill="none" stroke="#2B2520" stroke-width="0.4" opacity="0.55"/>

    <!-- Quatro cardinais -->
    <g fill="#2B2520">
      <circle cx="0" cy="-195" r="2.2"/>
      <circle cx="195" cy="0" r="2.2"/>
      <circle cx="0" cy="195" r="2.2"/>
      <circle cx="-195" cy="0" r="2.2"/>
    </g>
  </g>

  <!-- Orbita tipografica TIMELABS · CODEX · OPERANDI -->
  <text font-family="ui-monospace,'IBM Plex Mono','Consolas',monospace"
        font-size="11" fill="#2B2520" letter-spacing="3.4" font-weight="500">
    <textPath href="#orbit-c-top" startOffset="50%" text-anchor="middle" dominant-baseline="middle">
      TIMELABS · CODEX · OPERANDI
    </textPath>
  </text>

  <g transform="translate(300,300)">
    <!-- SEIS SIGILOS OPERACIONAIS nos vértices do hexágono (r=165) -->
    <g stroke="#2B2520" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- I · Transmutar (topo) -->
      <g transform="translate(0,-165)">
        <polygon points="0,-13 12,8 -12,8"/>
        <line x1="-7" y1="-1.5" x2="7" y2="-1.5"/>
      </g>
      <!-- II · Integrar -->
      <g transform="translate(143,-82.5)">
        <polygon points="0,-12 10.4,6 -10.4,6"/>
        <circle cx="0" cy="-12" r="2.4" fill="#2B2520" stroke="none"/>
        <circle cx="10.4" cy="6" r="2.4" fill="#2B2520" stroke="none"/>
        <circle cx="-10.4" cy="6" r="2.4" fill="#2B2520" stroke="none"/>
      </g>
      <!-- III · Otimizar -->
      <g transform="translate(143,82.5)">
        <polygon points="0,-12 13,0 0,12 -13,0"/>
        <line x1="-8" y1="0" x2="8" y2="0"/>
      </g>
      <!-- IV · Analisar (base) -->
      <g transform="translate(0,165)">
        <ellipse cx="0" cy="0" rx="14" ry="6.5"/>
        <circle cx="0" cy="0" r="2.8" fill="#E0B03A" stroke="none"/>
      </g>
      <!-- V · Ciclar -->
      <g transform="translate(-143,82.5)">
        <path d="M -8,3 A 10.5,10.5 0 1,1 7,-7"/>
        <polyline points="2.5,-9 7,-7 6,-2.5"/>
      </g>
      <!-- VI · Registrar -->
      <g transform="translate(-143,-82.5)">
        <path d="M -13,-7 L -13,7 L 0,4 L 13,7 L 13,-7 L 0,-4 Z"/>
        <line x1="0" y1="-4" x2="0" y2="4"/>
      </g>
    </g>

    <!-- Linhas radiais sigilo → reator -->
    <g stroke="#2B2520" stroke-width="0.4" opacity="0.4">
      <line x1="0" y1="-148" x2="0" y2="-95"/>
      <line x1="128.2" y1="-74" x2="73.6" y2="-42.5"/>
      <line x1="128.2" y1="74" x2="73.6" y2="42.5"/>
      <line x1="0" y1="148" x2="0" y2="95"/>
      <line x1="-128.2" y1="74" x2="-73.6" y2="42.5"/>
      <line x1="-128.2" y1="-74" x2="-73.6" y2="-42.5"/>
    </g>

    <!-- Hexagono central pointy-top R=85 -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5"
             fill="#EFE9DA" stroke="#2B2520" stroke-width="1.8"/>
    <polygon points="0,-78 67.5,-39 67.5,39 0,78 -67.5,39 -67.5,-39"
             fill="none" stroke="#2B2520" stroke-width="0.4" opacity="0.45"/>

    <!-- Mercurio central -->
    <circle r="22" fill="#E0B03A">
      <animate attributeName="opacity" values="1;0.78;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="#2B2520" stroke-width="1"/>
  </g>
</svg>
