<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Selo TimeLabs — Motor Alquímico">
  <g transform="translate(300,300)">
    <!-- Anel externo decorativo, fino -->
    <circle r="250" fill="none" stroke="#2B2520" stroke-width="0.6" opacity="0.4"/>

    <!-- QUATRO INPUTS NOS CARDINAIS (r=200) -->
    <g stroke="#2B2520" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- N · PROCESSOS — checklist -->
      <g transform="translate(0,-205)">
        <line x1="-10" y1="-12" x2="20" y2="-12"/>
        <line x1="-10" y1="-2" x2="20" y2="-2"/>
        <line x1="-10" y1="8" x2="20" y2="8"/>
        <polyline points="-20,-15 -16,-12 -12,-15" stroke-width="1.4"/>
        <polyline points="-20,-5 -16,-2 -12,-5" stroke-width="1.4"/>
        <polyline points="-20,5 -16,8 -12,5" stroke-width="1.4"/>
      </g>

      <!-- E · SISTEMAS — três nós conectados em triângulo -->
      <g transform="translate(205,0)">
        <circle cx="-13" cy="-11" r="3.2" fill="#2B2520" stroke="none"/>
        <circle cx="13" cy="-11" r="3.2" fill="#2B2520" stroke="none"/>
        <circle cx="0" cy="13" r="3.2" fill="#2B2520" stroke="none"/>
        <line x1="-13" y1="-11" x2="13" y2="-11" stroke-width="1.2"/>
        <line x1="13" y1="-11" x2="0" y2="13" stroke-width="1.2"/>
        <line x1="0" y1="13" x2="-13" y2="-11" stroke-width="1.2"/>
      </g>

      <!-- S · DADOS — barras + eixo -->
      <g transform="translate(0,205)">
        <rect x="-18" y="-3" width="6" height="14" fill="#2B2520" stroke="none"/>
        <rect x="-7" y="-12" width="6" height="23" fill="#2B2520" stroke="none"/>
        <rect x="4" y="-8" width="6" height="19" fill="#2B2520" stroke="none"/>
        <line x1="-22" y1="13" x2="14" y2="13" stroke-width="1.2"/>
      </g>

      <!-- W · PESSOAS — três silhuetas (cabeça + ombros) -->
      <g transform="translate(-205,0)">
        <circle cx="-14" cy="-6" r="4" fill="#2B2520" stroke="none"/>
        <circle cx="0" cy="-6" r="4" fill="#2B2520" stroke="none"/>
        <circle cx="14" cy="-6" r="4" fill="#2B2520" stroke="none"/>
        <path d="M -19,8 Q -14,2 -9,8" stroke-width="1.4"/>
        <path d="M -5,8 Q 0,2 5,8" stroke-width="1.4"/>
        <path d="M 9,8 Q 14,2 19,8" stroke-width="1.4"/>
      </g>
    </g>

    <!-- Quatro linhas radiais finas input → reator -->
    <g stroke="#2B2520" stroke-width="0.6" opacity="0.35">
      <line x1="0" y1="-180" x2="0" y2="-92"/>
      <line x1="180" y1="0" x2="92" y2="0"/>
      <line x1="0" y1="180" x2="0" y2="92"/>
      <line x1="-180" y1="0" x2="-92" y2="0"/>
    </g>

    <!-- Partículas de input — 4 micropontos, stagger 0.7s, loop 2.8s -->
    <g>
      <circle r="2.6" fill="#E0B03A" opacity="0">
        <animate attributeName="cy" values="-178;-92" dur="2.8s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" fill="#E0B03A" opacity="0">
        <animate attributeName="cx" values="178;92" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" fill="#E0B03A" opacity="0">
        <animate attributeName="cy" values="178;92" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" fill="#E0B03A" opacity="0">
        <animate attributeName="cx" values="-178;-92" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- REATOR central — hexagono pointy-top -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5"
             fill="#EFE9DA" stroke="#2B2520" stroke-width="2"/>
    <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36"
             fill="none" stroke="#2B2520" stroke-width="0.4" opacity="0.4"/>

    <!-- Mercúrio -->
    <circle r="20" fill="#E0B03A"/>
    <circle r="20" fill="none" stroke="#2B2520" stroke-width="1"/>

    <!-- OUTPUT — único vetor dourado em NE 45° -->
    <!-- Saindo do vértice NE do hex (~52,-52) até o destino (~178,-178) -->
    <g stroke="#E0B03A" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="60" y1="-60" x2="172" y2="-172" stroke-width="2"/>
      <!-- Cabeça de seta -->
      <polyline points="160,-162 172,-172 162,-160" stroke-width="2"/>
    </g>
    <!-- Destino: ponto de decisão -->
    <circle cx="185" cy="-185" r="5" fill="#E0B03A"/>
    <circle cx="185" cy="-185" r="5" fill="none" stroke="#2B2520" stroke-width="0.8"/>
    <!-- Pulso sutil no destino para indicar "decisão viva" -->
    <circle cx="185" cy="-185" r="5" fill="none" stroke="#E0B03A" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="5;14" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
