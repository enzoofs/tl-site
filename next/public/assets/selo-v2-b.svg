<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Selo TimeLabs — Fluxo de Transmutação">

  <defs>
    <!-- Glow dourado para partículas de saída + decisão -->
    <filter id="gold-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- =================================================================
       CENTRO · REATOR
       ================================================================= -->
  <g transform="translate(600,250)">
