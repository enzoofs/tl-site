             fill="none" stroke="#2B2520" stroke-width="0.5" opacity="0.45"/>

    <!-- Mercúrio central -->
    <g filter="url(#gold-glow)">
      <circle r="28" fill="#E0B03A">
        <animate attributeName="r" values="28;29.5;28" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="28" fill="none" stroke="#2B2520" stroke-width="1.2"/>

    <!-- Pulso outward -->
    <circle r="28" fill="none" stroke="#E0B03A" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="28;110" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================================================================
       DIREITA · DECISÃO · só o ponto final (sem trilho)
       ================================================================= -->
  <g filter="url(#gold-glow)">
